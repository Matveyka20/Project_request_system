# Production Docker Compose overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # Override app service for production
  app:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Must set DATABASE_URL to PostgreSQL in production
      # DATABASE_URL: postgresql://user:password@db:5432/requests_db
      LOG_LEVEL: WARNING
      REDIS_URL: redis://cache:6379/0
    
    # No volume mounts in production (use configuration only)
    volumes: []
    
    # Always restart in production
    restart: always
    
    # Strict health checks in production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # PostgreSQL configuration for production
  db:
    restart: always
    
    environment:
      # Add production-specific PostgreSQL settings
      POSTGRES_INITDB_ARGS: >
        --encoding=UTF8
        --locale=C
        --max_connections=200
        --shared_buffers=256MB
        --effective_cache_size=1GB
        --maintenance_work_mem=64MB
        --checkpoint_completion_target=0.9
        --wal_buffers=16MB
        --default_statistics_target=100

  # Redis configuration for production
  cache:
    restart: always
    
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 0

  # Disable pgAdmin in production
  pgadmin:
    profiles:
      - disabled
