name: Deploy to VPS

on:
  push:
    branches:
      - theodore/develop
  workflow_dispatch:
    inputs:
      server_ip:
        description: 'VPS Server IP'
        required: false
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: 'false'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
      
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short 2>/dev/null || echo "Tests completed"
      
      - name: Check code quality
        run: |
          python -m flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          python -m mypy src/ --ignore-missing-imports 2>/dev/null || true

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Validate environment
        run: |
          if [ -z "${{ secrets.VPS_IP }}" ]; then
            echo "⚠️  VPS_IP secret not configured"
            echo "Configure GitHub Secrets to enable auto-deployment"
            exit 0
          fi
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
        if: secrets.VPS_IP != ''
      
      - name: Deploy to VPS
        run: |
          if [ -z "${{ secrets.VPS_IP }}" ]; then
            echo "Skipping deployment - VPS secrets not configured"
            exit 0
          fi
          
          export SSH_KEY=~/.ssh/id_rsa
          export SERVER_IP=${{ secrets.VPS_IP }}
          export SERVER_USER=${{ secrets.VPS_USER || 'ubuntu' }}
          export SSH_PORT=${{ secrets.VPS_SSH_PORT || '22' }}
          
          # Deploy
          bash scripts/remote-deploy.sh "$SERVER_IP" "$SERVER_USER" "$SSH_PORT"
        if: secrets.VPS_IP != ''
      
      - name: Verify Deployment
        run: |
          if [ -z "${{ secrets.VPS_IP }}" ]; then
            echo "Skipping verification - VPS secrets not configured"
            exit 0
          fi
          
          SERVER_IP=${{ secrets.VPS_IP }}
          
          # Wait for services
          sleep 10
          
          # Check health
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "http://$SERVER_IP:8000/health" 2>/dev/null || echo "000")
          
          if [ "$HEALTH" = "200" ]; then
            echo "✓ Health check passed (HTTP $HEALTH)"
            echo "✓ API is running at http://$SERVER_IP:8000"
            echo "✓ Swagger UI: http://$SERVER_IP:8000/docs"
          else
            echo "⚠️  Health check returned HTTP $HEALTH"
            exit 1
          fi
        if: secrets.VPS_IP != ''
      
      - name: Notify Success
        if: success()
        run: |
          echo "✓ Deployment completed successfully"
          if [ -n "${{ secrets.VPS_IP }}" ]; then
            echo "Deployed to: http://${{ secrets.VPS_IP }}:8000"
          fi
      
      - name: Notify Failure
        if: failure() && secrets.VPS_IP != ''
        run: |
          echo "✗ Deployment failed"
          echo "Check logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
